name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lang_tutor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d lang_tutor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/lang_tutor_ci
      NEXT_TELEMETRY_DISABLED: '1'
      READING_PREVIEW: '0'
      VERCEL_ENV: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d26597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@9.15.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Verify database migrations
        run: pnpm db:migrate
      - name: Production build
        run: pnpm build
      - name: TypeScript
        run: pnpm typecheck
